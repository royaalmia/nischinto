<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <!-- Main Theme Background Gradient (Light, Crisp, Teal-50 to White to Slate-50) -->
    <linearGradient id="mainCoverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f0fdfa" />
      <stop offset="45%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f8fafc" />
    </linearGradient>

    <!-- N Logo Gradient -->
    <linearGradient id="coverLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00c49f" />
      <stop offset="50%" stopColor="#00b4d8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- Soft Ambient Mesh Glow -->
    <filter id="lightMeshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Crisp Card Drop Shadow -->
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f766e" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background (Main Theme Light Palette) -->
  <rect width="1640" height="624" fill="url(#mainCoverBg)" />

  <!-- Ambient Light Teal & Cyan Glow Clouds -->
  <circle cx="180" cy="120" r="320" fill="#ccfbf1" opacity="0.6" filter="url(#lightMeshGlow)" />
  <circle cx="1450" cy="180" r="380" fill="#e0f2fe" opacity="0.55" filter="url(#lightMeshGlow)" />
  <circle cx="850" cy="540" r="280" fill="#ecfdf5" opacity="0.5" filter="url(#lightMeshGlow)" />

  <!-- Subtle Minimal Tech Grid Lines -->
  <g stroke="#0f172a" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="104" x2="1640" y2="104" />
    <line x1="0" y1="208" x2="1640" y2="208" />
    <line x1="0" y1="312" x2="1640" y2="312" />
    <line x1="0" y1="416" x2="1640" y2="416" />
    <line x1="0" y1="520" x2="1640" y2="520" />
    <line x1="220" y1="0" x2="220" y2="624" />
    <line x1="470" y1="0" x2="470" y2="624" />
    <line x1="720" y1="0" x2="720" y2="624" />
    <line x1="970" y1="0" x2="970" y2="624" />
    <line x1="1220" y1="0" x2="1220" y2="624" />
    <line x1="1470" y1="0" x2="1470" y2="624" />
  </g>

  <!-- LEFT SECTION: Branding & Headlines -->
  <g transform="translate(100, 110)">
    <!-- Tagline Pill Badge (Matches Home Page Hero Pill) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" filter="url(#softCardShadow)" />
      <circle cx="20" cy="19" r="4.5" fill="#10b981" />
      <text x="36" y="24" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">
        ব্যবসা চালান নিশ্চিন্তে
      </text>
      <circle cx="258" cy="19" r="4.5" fill="#0d9488" />
    </g>

    <!-- Main Brand Title -->
    <g transform="translate(0, 85)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
        Nishchinto
      </text>
      <rect x="360" y="-48" width="94" height="46" rx="14" fill="#0d9488" />
      <text x="407" y="-16" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">
        .app
      </text>
      <text x="475" y="0" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="36" font-weight="800" fill="#0f766e">
        নিশ্চিন্ত
      </text>
    </g>

    <!-- Bengali High-Impact Tagline -->
    <text x="0" y="165" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="36" font-weight="800" fill="#0f172a">
      ই-কমার্স ও এফ-কমার্স অটোমেশন প্ল্যাটফর্ম
    </text>
    <text x="0" y="212" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="19" font-weight="500" fill="#475569">
      কুরিয়ার রিটার্ন লস রোধ, বাংলা AI ভয়েস কল ও স্বয়ংক্রিয় বিজ্ঞাপন ম্যানেজমেন্ট
    </text>

    <!-- Feature Checklist Pills -->
    <g transform="translate(0, 258)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="215" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#10b981" />
        <text x="36" y="25" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#1e293b">
          বাংলা AI ভয়েস কনফার্মেশন
        </text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(230, 0)">
        <rect width="195" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#0284c7" />
        <text x="36" y="25" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#1e293b">
          সেন্ট্রাল ফ্রড চেকার
        </text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(440, 0)">
        <rect width="185" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#0d9488" />
        <text x="36" y="25" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#1e293b">
          অটো অ্যাড পজ (স্টক ০)
        </text>
      </g>
    </g>

    <!-- Call to Action Banner -->
    <g transform="translate(0, 332)">
      <rect width="360" height="50" rx="14" fill="#0d9488" filter="url(#softCardShadow)" />
      <text x="180" y="31" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">
        🚀 আজই শুরু করুন • ১৪ দিনের ফ্রি ট্রায়াল
      </text>
      <text x="382" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569">
        www.nishchinto.app
      </text>
    </g>
  </g>

  <!-- RIGHT SECTION: 3D High-Tech Clean White Dashboard Mockup (Matches Site Theme) -->
  <g transform="translate(890, 80)">
    <!-- Main Dashboard Card -->
    <g filter="url(#softCardShadow)">
      <rect width="650" height="460" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    </g>
    
    <!-- Top Window Bar -->
    <g transform="translate(24, 24)">
      <circle cx="8" cy="8" r="6" fill="#f87171" />
      <circle cx="28" cy="8" r="6" fill="#fbbf24" />
      <circle cx="48" cy="8" r="6" fill="#34d399" />
      <text x="80" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">
        Nischinto Cockpit v2.4 • Live Realtime Analytics
      </text>
    </g>

    <!-- Top KPI Cards inside Mockup (Light Theme) -->
    <g transform="translate(24, 65)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="188" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="28" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#64748b">ডেলিভারি সাকসেস রেট</text>
      <text x="16" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#10b981">৯৪.৫%</text>
      <text x="16" y="80" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="700" fill="#059669">↑ রিটার্ন লস -৬৫% কমেছে</text>

      <!-- KPI 2 -->
      <rect x="206" y="0" width="188" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="222" y="28" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#64748b">ফ্রড পার্সেল আটকানো</text>
      <text x="222" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#dc2626">১,২৮০ টি</text>
      <text x="222" y="80" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="700" fill="#b91c1c">৳ ১,৯২,০০০ চার্জ সেভড</text>

      <!-- KPI 3 -->
      <rect x="412" y="0" width="188" height="92" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="428" y="28" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#64748b">AI কল কনফার্মেশন</text>
      <text x="428" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#0284c7">১০০%</text>
      <text x="428" y="80" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="700" fill="#0284c7">০ সেকেন্ডে অটো কল</text>
    </g>

    <!-- Floating Live Alert Card 1: AI Call Confirmed (Light Emerald) -->
    <g transform="translate(24, 180)">
      <rect width="600" height="76" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <circle cx="36" cy="38" r="18" fill="#dcfce7" />
      <text x="36" y="44" font-family="sans-serif" font-size="18" text-anchor="middle">🎙️</text>
      <text x="70" y="32" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="800" fill="#14532d">
        বাংলা AI ভয়েস কল সফল: তানভীর আহমেদ (উত্তরা)
      </text>
      <text x="70" y="55" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#166534">
        "গ্রাহক সাইজ ও ঠিকানা কনফার্ম করেছেন। Steadfast কুরিয়ারে ১-ক্লিকে পাঠানো হয়েছে।"
      </text>
      <rect x="495" y="24" width="88" height="28" rx="8" fill="#16a34a" />
      <text x="539" y="43" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
        কনফার্মড ✓
      </text>
    </g>

    <!-- Floating Live Alert Card 2: Fraud Alert Stopped (Light Red) -->
    <g transform="translate(24, 275)">
      <rect width="600" height="76" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <circle cx="36" cy="38" r="18" fill="#fee2e2" />
      <text x="36" y="44" font-family="sans-serif" font-size="18" text-anchor="middle">🛡️</text>
      <text x="70" y="32" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="800" fill="#991b1b">
        সেন্ট্রাল কুরিয়ার ফ্রড অ্যালার্ট: রিস্ক স্কোর ৮৮% (উচ্চ ঝুঁকি)
      </text>
      <text x="70" y="55" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#b91c1c">
        নম্বর: 01999****11 • পূর্বের ৭টি অর্ডারের ৬টিই রিটার্ন • অগ্রিম ডেলিভারি চার্জ রিকমেন্ডেড
      </text>
      <rect x="495" y="24" width="88" height="28" rx="8" fill="#dc2626" />
      <text x="539" y="43" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
        হোল্ডে রাখুন ✕
      </text>
    </g>

    <!-- Floating Live Alert Card 3: Ad Autopilot Stopped Zero Stock (Light Amber) -->
    <g transform="translate(24, 370)">
      <rect width="600" height="65" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" />
      <circle cx="36" cy="32" r="14" fill="#fef3c7" />
      <text x="36" y="37" font-family="sans-serif" font-size="14" text-anchor="middle">⚡</text>
      <text x="65" y="28" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="800" fill="#92400e">
        AI অটো অ্যাড গার্ড: ওয়্যারলেস এয়ারবাডস স্টক ০ হয়েছে
      </text>
      <text x="65" y="48" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="600" fill="#b45309">
        মেটা অ্যাড ম্যানেজারে ক্যাম্পেইন স্বয়ংক্রিয়ভাবে পজ করা হয়েছে। বাজেট অপচয় রোধ: ৳ ৩,৫০০
      </text>
    </g>
  </g>
</svg>
